<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المساعدة والدعم - تطبيق فريق روح التعليمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="rouh-core.js"></script>

    <style>
        /* ==================== المتغيرات اللونية والخط الافتراضي للنظام (الوضع النهاري افتراضي) ==================== */
        :root {
            --rouh-green: #159934;
            --rouh-green-dark: #0b5e1e;
            --rouh-green-deep: #063811;
            --rouh-green-bright: #22c55e;
            --rouh-soft: #e8faee;

            --clr-blue: #3b82f6;
            --clr-purple: #8b5cf6;
            --clr-emerald: #10b981;
            --clr-orange: #f97316;
            --clr-rose: #f43f5e;
            --clr-cyan: #06b6d4;
            --clr-amber: #f59e0b;

            /* الوضع النهاري الافتراضي */
            --bg-outer: #e4ece7;
            --bg-app: #f4f8f5;
            --bg-chat-pattern: #eaf2ed;
            --bg-card: #ffffff;
            --bg-subtle: #e9f2ec;
            --bg-glass: rgba(255, 255, 255, 0.96);
            --text-primary: #0f1f14;
            --text-secondary: #5a7061;
            --border-light: #dfece3;
            --card-shadow: 0 8px 22px rgba(11, 94, 30, 0.06);

            /* ألوان فقاعات الدردشة في الوضع النهاري */
            --bubble-out-bg: linear-gradient(135deg, #159934, #0d7a28);
            --bubble-out-text: #ffffff;
            --bubble-in-bg: #ffffff;
            --bubble-in-text: #0f1f14;
        }

        /* الوضع الليلي المتناغم تلقائياً مع كافة الأقسام */
        body.dark-ui {
            --bg-outer: #040805;
            --bg-app: #0a110c;
            --bg-chat-pattern: #080e0a;
            --bg-card: #121d16;
            --bg-subtle: #19281f;
            --bg-glass: rgba(18, 29, 22, 0.96);
            --rouh-soft: rgba(34, 197, 94, 0.15);
            --text-primary: #f0f9f2;
            --text-secondary: #94ab9b;
            --border-light: #1f3325;
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);

            /* ألوان فقاعات الدردشة في الوضع الليلي */
            --bubble-out-bg: linear-gradient(135deg, #0b5e1e, #064214);
            --bubble-out-text: #f0f9f2;
            --bubble-in-bg: #16241b;
            --bubble-in-text: #f0f9f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        a { text-decoration: none; color: inherit; }

        body {
            background-color: var(--bg-outer);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .phone-frame {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--bg-app);
            position: relative;
            display: flex;
            flex-direction: column;
            padding-top: 66px;
            padding-bottom: 84px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
        }

        @keyframes bubblePop {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseOnline {
            0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); }
            50% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
        }

        /* ==================== الشريط العلوي الثابت ==================== */
        .glass-topbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 66px;
            background: linear-gradient(135deg, var(--rouh-green-deep) 0%, var(--rouh-green-dark) 55%, var(--rouh-green) 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(6, 56, 17, 0.28);
        }

        .top-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .top-brand img {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 2px solid #4ade80;
            background: #ffffff;
            object-fit: cover;
        }

        .top-brand-text h2 {
            font-size: 0.95rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .top-brand-text span {
            font-size: 0.71rem;
            color: #bbf7d0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .online-dot-top {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulseOnline 2s infinite;
        }

        .top-tools {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn {
            width: 38px;
            height: 38px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .tool-btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.25); }
        .tool-btn:active { transform: scale(0.92); }

        /* ==================== شريط معلومات الحساب والمواضيع السريعة ==================== */
        .support-sub-bar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            z-index: 10;
        }

        .active-account-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--rouh-soft);
            color: var(--rouh-green);
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .active-account-pill:active { transform: scale(0.95); }

        .quick-topics-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 7px 12px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            scrollbar-width: none;
        }

        .quick-topics-row::-webkit-scrollbar { display: none; }

        .topic-quick-btn {
            padding: 5px 11px;
            border-radius: 14px;
            border: 1px solid var(--border-light);
            background: var(--bg-subtle);
            color: var(--text-primary);
            font-size: 0.71rem;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .topic-quick-btn:hover {
            transform: translateY(-2px);
            border-color: var(--rouh-green);
        }

        .topic-quick-btn:active { transform: scale(0.94); }

        /* ==================== منطقة رسائل الدردشة النظامية ==================== */
        .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
            background-color: var(--bg-chat-pattern);
            background-image: radial-gradient(rgba(21, 153, 52, 0.07) 1px, transparent 0);
            background-size: 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-date-divider {
            align-self: center;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 84%;
            position: relative;
            animation: bubblePop 0.22s ease-out;
        }

        /* رسائل الطالب (صادرة - جهة اليمين في RTL) */
        .msg-row.outgoing {
            align-self: flex-start;
        }

        /* رسائل فريق الدعم (واردة - جهة اليسار في RTL) */
        .msg-row.incoming {
            align-self: flex-end;
        }

        .msg-bubble {
            padding: 10px 13px 8px;
            border-radius: 18px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
            transition: transform 0.15s ease;
            word-wrap: break-word;
        }

        .msg-bubble:active { transform: scale(0.98); }

        .msg-row.outgoing .msg-bubble {
            background: var(--bubble-out-bg);
            color: var(--bubble-out-text);
            border-top-right-radius: 4px;
        }

        .msg-row.incoming .msg-bubble {
            background: var(--bubble-in-bg);
            color: var(--bubble-in-text);
            border: 1px solid var(--border-light);
            border-top-left-radius: 4px;
        }

        .msg-sender-name {
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--rouh-green);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* اقتباس الرد داخل الفقاعة */
        .msg-reply-quote {
            background: rgba(0, 0, 0, 0.14);
            border-right: 3px solid #fde68a;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 0.7rem;
            margin-bottom: 6px;
            opacity: 0.92;
        }

        .msg-row.incoming .msg-reply-quote {
            background: var(--bg-subtle);
            border-right-color: var(--rouh-green);
        }

        .msg-attached-img {
            width: 100%;
            max-height: 210px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 6px;
            display: block;
        }

        .msg-text-content {
            font-size: 0.83rem;
            line-height: 1.55;
            white-space: pre-line;
        }

        .msg-meta-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            font-size: 0.63rem;
            margin-top: 4px;
            opacity: 0.82;
        }

        .edited-tag {
            font-style: italic;
            font-weight: 700;
        }

        /* شارة التفاعل (Emoji Reaction) أسفل الفقاعة */
        .msg-reaction-badge {
            align-self: flex-end;
            margin-top: -6px;
            margin-left: 8px;
            background: var(--bg-card);
            border: 1.5px solid var(--border-light);
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.78rem;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
            z-index: 3;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .msg-reaction-badge:hover { transform: scale(1.12); }

        /* ==================== شريط تعديل أو الرد على رسالة فوق صندوق الإدخال ==================== */
        .composer-context-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--bg-subtle);
            border-top: 1px solid var(--border-light);
            border-right: 4px solid var(--rouh-green);
            padding: 7px 12px;
        }

        .composer-context-banner.active {
            display: flex;
        }

        .ctx-info {
            flex: 1;
            overflow: hidden;
        }

        .ctx-info strong {
            font-size: 0.72rem;
            color: var(--rouh-green);
            display: block;
        }

        .ctx-info p {
            font-size: 0.74rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ctx-cancel-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
        }

        /* ==================== صندوق كتابة وإرسال الرسالة السفلي ==================== */
        .chat-composer-bar {
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 15;
        }

        .attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            border: 1px solid var(--border-light);
            background: var(--bg-subtle);
            color: var(--rouh-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .attach-btn:hover { transform: translateY(-2px); }
        .attach-btn:active { transform: scale(0.92); }

        .chat-input-field {
            flex: 1;
            padding: 10px 14px;
            border-radius: 18px;
            border: 1.5px solid var(--border-light);
            background: var(--bg-app);
            color: var(--text-primary);
            font-size: 0.84rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-field:focus { border-color: var(--rouh-green); }

        .send-msg-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--rouh-green-bright), var(--rouh-green-dark));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(21, 153, 52, 0.3);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .send-msg-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(21, 153, 52, 0.4); }
        .send-msg-btn:active { transform: scale(0.92); }

        /* ==================== الشريط السفلي الثابت ==================== */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-light);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            align-items: end;
            padding: 6px 8px 10px;
            z-index: 2000;
            box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.08);
        }

        .dock-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.68rem;
            font-weight: 800;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .dock-btn:hover { transform: translateY(-2px); }
        .dock-btn:active { transform: scale(0.95); }

        .dock-icon-box {
            width: 36px;
            height: 32px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .dock-btn.active { color: var(--rouh-green); }
        .dock-btn.active .dock-icon-box { background: var(--rouh-soft); color: var(--rouh-green); transform: translateY(-2px); }

        .dock-btn.center-home-btn { position: relative; background: transparent !important; padding-top: 0; }

        .center-home-orb {
            width: 50px;
            height: 50px;
            border-radius: 18px;
            background: var(--bg-card);
            border: 2px solid var(--border-light);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-top: -20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        /* ==================== قائمة خيارات الرسالة المنبثقة (تفاعل + تعديل + حذف + رد) ==================== */
        .modal-wrap {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 3000;
        }

        .modal-wrap.open { display: flex; }

        .action-sheet-box {
            background: var(--bg-card);
            border-radius: 26px 26px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 18px 16px 22px;
            border-top: 2px solid var(--rouh-green);
            animation: bubblePop 0.2s ease-out;
        }

        .reactions-picker-bar {
            display: flex;
            justify-content: space-around;
            background: var(--bg-subtle);
            border: 1px solid var(--border-light);
            padding: 8px 10px;
            border-radius: 20px;
            margin-bottom: 14px;
        }

        .react-emoji-btn {
            font-size: 1.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .react-emoji-btn:hover { transform: scale(1.28); }
        .react-emoji-btn:active { transform: scale(0.95); }

        .sheet-actions-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sheet-action-btn {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-light);
            background: var(--bg-app);
            color: var(--text-primary);
            font-size: 0.84rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .sheet-action-btn:active { transform: scale(0.98); }
        .sheet-action-btn.danger { color: #f43f5e; background: rgba(244, 63, 94, 0.08); border-color: rgba(244, 63, 94, 0.25); }

        .toast-alert {
            position: fixed;
            bottom: 96px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--rouh-green-deep);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 800;
            z-index: 4000;
            display: none;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body> <!-- الوضع النهاري هو الافتراضي ويتزامن تلقائياً مع باقي الأقسام -->

<div class="phone-frame">

    <!-- ==================== الشريط العلوي الثابت ==================== -->
    <header class="glass-topbar">
        <div class="top-brand" onclick="triggerGoNav('home', this)">
            <img src="https://i.ibb.co/whHk6hcT/IMG-20261011-WA0031.jpg" alt="فريق روح التعليمي">
            <div class="top-brand-text">
                <h2>المساعدة والدعم الفني</h2>
                <span>
                    <span class="online-dot-top"></span>
                    متصل الآن • فريق دعم روح
                </span>
            </div>
        </div>
        <div class="top-tools">
            <button class="tool-btn" onclick="toggleDarkUI()" title="تبديل المظهر">
                <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
            </button>
            <button class="tool-btn" onclick="triggerGoNav('profile', this)" title="عودة للملف الشخصي">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </header>

    <!-- ==================== شريط معلومات حساب الطالب الحالي ==================== -->
    <div class="support-sub-bar">
        <div class="active-account-pill" title="حسابك الحالي">
            <i class="fa-solid fa-user-check"></i>
            <span id="currentAccountBadge">الحساب: طالب روح</span>
            <i class="fa-solid fa-chevron-down" style="font-size:0.62rem;"></i>
        </div>
        <span style="font-size:0.68rem; color:var(--text-secondary); font-weight:700;">
            اضغط على أي رسالة للتفاعل أو التعديل أو الحذف
        </span>
    </div>

    <!-- ==================== شريط الاستفسارات السريعة ==================== -->
    <div class="quick-topics-row">
        <button class="topic-quick-btn" onclick="sendQuickTopic('كيف يمكنني تفعيل كود باقة روح VIP؟')">
            <i class="fa-solid fa-crown" style="color:#f59e0b;"></i> تفعيل كود VIP
        </button>
        <button class="topic-quick-btn" onclick="sendQuickTopic('أين أجد النوط الذهبية والملخصات بصيغة PDF؟')">
            <i class="fa-solid fa-file-pdf" style="color:#8b5cf6;"></i> طلب نوطة أو ملخص
        </button>
        <button class="topic-quick-btn" onclick="sendQuickTopic('أريد تقديم طلب لتوثيق حسابي في المنصة')">
            <i class="fa-solid fa-certificate" style="color:#3b82f6;"></i> توثيق الحساب
        </button>
        <button class="topic-quick-btn" onclick="sendQuickTopic('لدي مشكلة تقنية في تشغيل أحد الفيديوهات')">
            <i class="fa-solid fa-headset" style="color:#10b981;"></i> مساعدة تقنية
        </button>
    </div>

    <!-- ==================== منطقة رسائل الدردشة النظامية ==================== -->
    <main class="chat-messages-area" id="chatMessagesStream"></main>

    <!-- ==================== شريط معاينة التعديل أو الرد على الرسالة ==================== -->
    <div class="composer-context-banner" id="composerContextBanner">
        <div class="ctx-info">
            <strong id="ctxTitleText">تعديل الرسالة</strong>
            <p id="ctxPreviewText">نص الرسالة...</p>
        </div>
        <button class="ctx-cancel-btn" onclick="cancelComposerMode()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- ==================== شريط كتابة وإرسال الرسائل ==================== -->
    <div class="chat-composer-bar">
        <button class="attach-btn" onclick="document.getElementById('chatImgInput').click()" title="إرفاق صورة">
            <i class="fa-regular fa-image"></i>
        </button>
        <input type="file" id="chatImgInput" accept="image/*" style="display:none;" onchange="handleChatImageUpload(event)">

        <input type="text" class="chat-input-field" id="chatMessageInput" placeholder="اكتب رسالتك لفريق الدعم..." onkeydown="if(event.key==='Enter') handleSendOrEditMessage();">

        <button class="send-msg-btn" id="sendMsgBtnEl" onclick="handleSendOrEditMessage()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <!-- ==================== الشريط السفلي الثابت ==================== -->
    <nav class="bottom-dock">
        <button class="dock-btn active" id="dock-profile" onclick="triggerGoNav('profile', this)">
            <div class="dock-icon-box"><i class="fa-solid fa-user-astronaut"></i></div>
            <span>الملف الشخصي</span>
        </button>

        <button class="dock-btn" id="dock-news" onclick="triggerGoNav('news', this)">
            <div class="dock-icon-box"><i class="fa-solid fa-newspaper"></i></div>
            <span>الأخبار</span>
        </button>

        <button class="dock-btn center-home-btn" id="dock-home" onclick="triggerGoNav('home', this)">
            <div class="center-home-orb">
                <i class="fa-solid fa-house-chimney"></i>
            </div>
            <span>الرئيسية</span>
        </button>

        <button class="dock-btn" id="dock-quizzes" onclick="triggerGoNav('quizzes', this)">
            <div class="dock-icon-box"><i class="fa-solid fa-clipboard-check"></i></div>
            <span>الاختبارات</span>
        </button>

        <button class="dock-btn" id="dock-chat" onclick="triggerGoNav('chat')">
            <div class="dock-icon-box"><i class="fa-solid fa-comments"></i></div>
            <span>الدردشة</span>
        </button>
    </nav>

</div>

<!-- نافذة خيارات الرسالة (التفاعل + التعديل + الحذف + الرد) -->
<div class="modal-wrap" id="msgActionModal" onclick="if(event.target===this) closeActionModal()">
    <div class="action-sheet-box" id="actionSheetContent"></div>
</div>

<div class="toast-alert" id="toastBox">تم بنجاح!</div>

<script>
    function triggerGoNav(key) { Rouh.go(key); }

    function applySavedTheme() { Rouh.applyTheme('themeToggleIcon'); }
    function toggleDarkUI() { Rouh.toggleTheme('themeToggleIcon'); }

    // ==================== إدارة حساب الطالب الحالي وسجل محادثاته المستقل ====================
    let activeAccount = { name: 'طالب روح', phone: '', city: '', stage: '' };
    let threadId = null;
    let currentThreadMessages = []; // { id, sender, senderName, text, time, edited, reaction, replyTo, image, mine }
    let editingMessageId = null;
    let replyingToMessageObj = null;
    let supportChannel = null;

    const WELCOME_TEXT = () => `أهلاً بك يا (${activeAccount.name}) في مركز المساعدة والدعم المباشر لمنصة فريق روح التعليمي 🌟\n\nكيف يمكننا مساعدتك اليوم؟ اكتب سؤالك وسيرد عليك أحد المشرفين.`;

    async function loadAccountAndChat() {
        const me = await Rouh.init();
        if (!me) return;
        Rouh.applyTheme('themeToggleIcon');
        activeAccount = { name: me.full_name, phone: me.phone, city: me.city, stage: Rouh.STAGE_NAMES[me.stage] || me.stage };
        document.getElementById('currentAccountBadge').innerText = `الحساب: ${activeAccount.name}`;

        const { data: th } = await Rouh.sb.from('support_threads').select('id').eq('student_id', me.id).maybeSingle();
        threadId = th ? th.id : null;
        await reloadMessages();
        subscribeThread();
        if (threadId) Rouh.sb.from('support_threads').update({ unread_student: 0 }).eq('id', threadId);
    }

    function mapMsg(r, byId) {
        const mine = r.sender_id === Rouh.me.id;
        const ref = r.reply_to && byId ? byId[r.reply_to] : null;
        return {
            id: r.id,
            sender: r.sender_kind === 'student' ? 'student' : 'support',
            senderName: r.sender_kind === 'student' ? activeAccount.name : 'فريق دعم روح التعليمي',
            text: r.body,
            time: Rouh.clockTime(r.created_at),
            edited: r.edited,
            reaction: r.reaction || '',
            replyTo: ref ? { senderName: ref.sender_kind === 'student' ? activeAccount.name : 'فريق دعم روح التعليمي', text: ref.body.slice(0, 70) } : null,
            image: Rouh.safeUrl(r.image_url),
            mine: mine
        };
    }

    async function reloadMessages() {
        let rows = [];
        if (threadId) {
            const { data } = await Rouh.sb.from('support_messages').select('*').eq('thread_id', threadId).order('created_at', { ascending: true }).limit(500);
            rows = data || [];
        }
        const byId = {}; rows.forEach(r => byId[r.id] = r);
        currentThreadMessages = [{
            id: 'welcome', sender: 'support', senderName: 'فريق دعم روح التعليمي', text: WELCOME_TEXT(),
            time: '', edited: false, reaction: '', replyTo: null, image: '', mine: false, local: true
        }].concat(rows.map(r => mapMsg(r, byId)));
        renderChatStream();
    }

    function subscribeThread() {
        if (!threadId || supportChannel) return;
        supportChannel = Rouh.sb.channel('support-' + threadId)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'support_messages', filter: 'thread_id=eq.' + threadId }, () => reloadMessages())
            .subscribe();
    }

    async function ensureThread() {
        if (threadId) return threadId;
        const { data, error } = await Rouh.sb.from('support_threads').insert({ student_id: Rouh.me.id }).select('id').single();
        if (error) {
            const again = await Rouh.sb.from('support_threads').select('id').eq('student_id', Rouh.me.id).maybeSingle();
            if (!again.data) throw error;
            threadId = again.data.id;
        } else threadId = data.id;
        subscribeThread();
        return threadId;
    }

    // ==================== عرض رسائل الدردشة ====================
    function renderChatStream() {
        const stream = document.getElementById('chatMessagesStream');
        const e = Rouh.esc;
        const dateHeader = `<div class="chat-date-divider">محادثة الدعم المباشرة</div>`;

        const bubblesHTML = currentThreadMessages.map(msg => {
            const isOut = msg.sender === 'student';
            const replyHTML = msg.replyTo ? `
                <div class="msg-reply-quote">
                    <strong>رد على: ${e(msg.replyTo.senderName)}</strong>
                    <div>${e(msg.replyTo.text)}</div>
                </div>
            ` : '';
            const imgHTML = msg.image ? `<img src="${e(msg.image)}" class="msg-attached-img" alt="مرفق">` : '';
            const click = msg.local ? '' : `onclick="openMessageActions('${e(msg.id)}')"`;
            return `
                <div class="msg-row ${isOut ? 'outgoing' : 'incoming'}" id="row-${e(msg.id)}">
                    <div class="msg-bubble" ${click}>
                        ${!isOut ? `<div class="msg-sender-name"><i class="fa-solid fa-shield-halved"></i> ${e(msg.senderName)}</div>` : ''}
                        ${replyHTML}
                        ${imgHTML}
                        <div class="msg-text-content">${e(msg.text)}</div>
                        <div class="msg-meta-footer">
                            ${msg.edited ? '<span class="edited-tag">(معدّلة)</span>' : ''}
                            <span>${e(msg.time)}</span>
                            ${isOut ? '<i class="fa-solid fa-check-double" style="color:#bbf7d0;"></i>' : ''}
                        </div>
                    </div>
                    ${msg.reaction ? `<div class="msg-reaction-badge" ${click}>${e(msg.reaction)}</div>` : ''}
                </div>
            `;
        }).join('');

        stream.innerHTML = dateHeader + bubblesHTML;
        stream.scrollTop = stream.scrollHeight;
    }

    // ==================== إرسال أو تعديل الرسالة ====================
    async function handleSendOrEditMessage() {
        const inp = document.getElementById('chatMessageInput');
        const text = inp.value.trim();
        if (!text) return;

        if (editingMessageId) {
            const { error } = await Rouh.sb.from('support_messages').update({ body: text, edited: true }).eq('id', editingMessageId);
            if (error) { showToast('تعذر تعديل الرسالة ⚠️'); return; }
            showToast('تم تعديل الرسالة بنجاح ✏️');
            cancelComposerMode();
            inp.value = '';
            await reloadMessages();
            return;
        }
        try {
            const tid = await ensureThread();
            const replyId = replyingToMessageObj ? replyingToMessageObj.id : null;
            inp.value = '';
            cancelComposerMode();
            const { error } = await Rouh.sb.from('support_messages').insert({
                thread_id: tid, sender_id: Rouh.me.id, sender_kind: 'student', body: text, reply_to: replyId
            });
            if (error) throw error;
            await reloadMessages();
        } catch (err) {
            inp.value = text;
            showToast('تعذر إرسال الرسالة ⚠️');
        }
    }

    function sendQuickTopic(topicText) {
        document.getElementById('chatMessageInput').value = topicText;
        handleSendOrEditMessage();
    }

    // ==================== إرفاق صورة في الدردشة ====================
    async function handleChatImageUpload(event) {
        const file = event.target.files[0];
        event.target.value = '';
        if (!file) return;
        try {
            showToast('جارٍ رفع الصورة...');
            const url = await Rouh.uploadImage(file, 'support');
            const tid = await ensureThread();
            const { error } = await Rouh.sb.from('support_messages').insert({
                thread_id: tid, sender_id: Rouh.me.id, sender_kind: 'student', body: 'صورة مرفقة للدعم الفني', image_url: url
            });
            if (error) throw error;
            await reloadMessages();
            showToast('تم إرسال الصورة لفريق الدعم 📷');
        } catch (err) {
            showToast('تعذر إرسال الصورة ⚠️');
        }
    }

    // ==================== نافذة التفاعل وتعديل وحذف الرسالة والرد عليها ====================
    function openMessageActions(msgId) {
        const msg = currentThreadMessages.find(m => m.id === msgId);
        if (!msg) return;

        const isMyMsg = msg.mine;
        const emojis = ['❤️', '👍', '🔥', '🌟', '🙏', '👏'];

        const reactionsHTML = emojis.map(em => `
            <button class="react-emoji-btn" onclick="setReactionOnMessage('${msg.id}', '${em}')">${em}</button>
        `).join('');

        document.getElementById('actionSheetContent').innerHTML = `
            <div style="text-align:center; font-size:0.78rem; font-weight:800; color:var(--text-secondary); margin-bottom:10px;">
                تفاعل مع الرسالة أو اختر إجراءً
            </div>

            <div class="reactions-picker-bar">
                ${reactionsHTML}
            </div>

            <div class="sheet-actions-grid">
                <button class="sheet-action-btn" onclick="startReplyToMessage('${msg.id}')">
                    <i class="fa-solid fa-reply" style="color:var(--rouh-green);"></i>
                    <span>الرد على هذه الرسالة</span>
                </button>

                <button class="sheet-action-btn" onclick="copyMessageText('${msg.id}')">
                    <i class="fa-regular fa-copy" style="color:var(--clr-blue);"></i>
                    <span>نسخ نص الرسالة</span>
                </button>

                ${isMyMsg ? `
                    <button class="sheet-action-btn" onclick="startEditMessage('${msg.id}')">
                        <i class="fa-solid fa-pen-to-square" style="color:var(--clr-amber);"></i>
                        <span>تعديل الرسالة</span>
                    </button>

                    <button class="sheet-action-btn danger" onclick="deleteMessageById('${msg.id}')">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>حذف الرسالة نهائياً</span>
                    </button>
                ` : ''}
            </div>
        `;

        document.getElementById('msgActionModal').classList.add('open');
    }

    function closeActionModal() {
        document.getElementById('msgActionModal').classList.remove('open');
    }

    async function setReactionOnMessage(msgId, emoji) {
        const msg = currentThreadMessages.find(m => m.id === msgId);
        if (!msg) return;
        const next = (msg.reaction === emoji) ? null : emoji;
        const { error } = await Rouh.sb.from('support_messages').update({ reaction: next }).eq('id', msgId);
        closeActionModal();
        if (error) { showToast('تعذر إضافة التفاعل ⚠️'); return; }
        await reloadMessages();
    }

    function startEditMessage(msgId) {
        const msg = currentThreadMessages.find(m => m.id === msgId);
        if (!msg) return;

        editingMessageId = msgId;
        replyingToMessageObj = null;

        document.getElementById('ctxTitleText').innerText = '✏️ جاري تعديل رسالتك:';
        document.getElementById('ctxPreviewText').innerText = msg.text;
        document.getElementById('composerContextBanner').classList.add('active');

        const inp = document.getElementById('chatMessageInput');
        inp.value = msg.text;
        inp.focus();
        document.getElementById('sendMsgBtnEl').innerHTML = '<i class="fa-solid fa-check"></i>';
        closeActionModal();
    }

    async function deleteMessageById(msgId) {
        const { error } = await Rouh.sb.from('support_messages').delete().eq('id', msgId);
        closeActionModal();
        if (error) { showToast('تعذر حذف الرسالة ⚠️'); return; }
        await reloadMessages();
        showToast('تم حذف الرسالة بنجاح 🗑️');
    }

    function startReplyToMessage(msgId) {
        const msg = currentThreadMessages.find(m => m.id === msgId);
        if (!msg) return;

        editingMessageId = null;
        replyingToMessageObj = { id: msg.id, senderName: msg.senderName, text: msg.text.slice(0, 70) };

        document.getElementById('ctxTitleText').innerText = `↩️ الرد على (${msg.senderName}):`;
        document.getElementById('ctxPreviewText').innerText = msg.text;
        document.getElementById('composerContextBanner').classList.add('active');

        document.getElementById('chatMessageInput').focus();
        document.getElementById('sendMsgBtnEl').innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
        closeActionModal();
    }

    function copyMessageText(msgId) {
        const msg = currentThreadMessages.find(m => m.id === msgId);
        if (msg && navigator.clipboard) {
            navigator.clipboard.writeText(msg.text);
        }
        closeActionModal();
        showToast('تم نسخ نص الرسالة 📋');
    }

    function cancelComposerMode() {
        editingMessageId = null;
        replyingToMessageObj = null;
        document.getElementById('composerContextBanner').classList.remove('active');
        document.getElementById('sendMsgBtnEl').innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
    }

    function showToast(msg) {
        const t = document.getElementById('toastBox');
        t.innerText = msg;
        t.style.display = 'block';
        clearTimeout(window._tstTimer);
        window._tstTimer = setTimeout(() => { t.style.display = 'none'; }, 2200);
    }

    window.onload = loadAccountAndChat;
</script>

</body>
</html>
